version: "3.9"

services:
  fb-monitor:
    build: .
    container_name: fb-page-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./config.json:/app/config.json
      - ./AGENTS.md:/app/AGENTS.md
    environment:
      - FLASK_ENV=production
      - PORT=5000
    shm_size: "256mb"   # Chrome cần shared memory
